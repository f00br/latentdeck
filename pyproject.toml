[project]
name = "latentdeck-python-workspace"
version = "0.1.0"
description = "Shared Python workspace for LatentDeck codec and SDK packages."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "codec-host/python",
    "codec-host/rgb-ring",
    "codec-host/codecs/h3",
    "comfy/latent-cartridge",
    "sdk/python",
]

[tool.uv.sources]
latentdeck-codec-host = { workspace = true }
latentdeck-cartridge = { workspace = true }
latentdeck-rgb-ring = { workspace = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = [
    "codec-host/python/tests",
    "codec-host/rgb-ring/tests",
    "codec-host/codecs/h3/tests",
    "comfy/latent-cartridge/tests",
    "sdk/python/tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
