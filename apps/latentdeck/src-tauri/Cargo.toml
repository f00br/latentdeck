[package]
name = "latentdeck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LatentDeck desktop synthesis instrument"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
spout-sdk = ["latentdeck-native-output/spout-sdk"]
private-protocol2-gpu-e2e = ["spout-sdk"]

[[bin]]
name = "latentdeck-private-protocol2-gpu-e2e"
path = "src/private_protocol2_gpu_e2e_main.rs"
required-features = ["private-protocol2-gpu-e2e"]

[build-dependencies]
latentdeck-extension-manager = { path = "../../../crates/extension-manager" }
serde_json.workspace = true
tauri-build.workspace = true

[dependencies]
atomicwrites.workspace = true
latentdeck-cartridge = { path = "../../../crates/cartridge" }
latentdeck-control = { path = "../../../crates/control" }
latentdeck-core = { path = "../../../crates/core" }
latentdeck-deck-runtime-contracts = { path = "../../../crates/deck-runtime-contracts" }
latentdeck-extension-manager = { path = "../../../crates/extension-manager" }
latentdeck-gpu = { path = "../../../crates/gpu" }
latentdeck-library = { path = "../../../crates/library" }
latentdeck-native-output = { path = "../../../crates/native-output" }
latentdeck-output-mp4 = { path = "../../../crates/output-mp4" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
rmp-serde.workspace = true
uuid.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[lints]
workspace = true
