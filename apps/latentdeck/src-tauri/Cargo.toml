[package]
name = "latentdeck-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LatentDeck desktop synthesis instrument"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
spout-sdk = ["latentdeck-native-output/spout-sdk"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
atomicwrites.workspace = true
latentdeck-cartridge = { path = "../../../crates/cartridge" }
latentdeck-control = { path = "../../../crates/control" }
latentdeck-core = { path = "../../../crates/core" }
latentdeck-gpu = { path = "../../../crates/gpu" }
latentdeck-library = { path = "../../../crates/library" }
latentdeck-native-output = { path = "../../../crates/native-output" }
latentdeck-output-mp4 = { path = "../../../crates/output-mp4" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[lints]
workspace = true
