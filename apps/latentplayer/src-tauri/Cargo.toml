[package]
name = "latentplayer-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LatentPlayer desktop cartridge player"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
spout-sdk = ["latentdeck-native-output/spout-sdk"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
latentdeck-control = { path = "../../../crates/control" }
latentdeck-core = { path = "../../../crates/core" }
latentdeck-gpu = { path = "../../../crates/gpu" }
latentdeck-native-output = { path = "../../../crates/native-output" }
serde.workspace = true
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
wgpu.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
