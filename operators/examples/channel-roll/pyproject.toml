[project]
name = "latentdeck-example-channel-roll"
version = "0.1.0"
description = "Separately installed example community operator for LatentDeck."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "latentdeck-comfy-toolkit==0.1.0",
]

[project.optional-dependencies]
cu130 = [
    "torch==2.13.0",
]
test = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv-build==0.12.7"]
build-backend = "uv_build"

[tool.uv-build]
package-data = [
    "src/latentdeck_example_channel_roll/descriptor.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
