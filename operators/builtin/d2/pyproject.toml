[project]
name = "latentdeck-operator-d2"
version = "0.2.0"
description = "Trusted built-in LD-D2 latent synthesis operators for LatentDeck."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "latentdeck-deck-sdk==0.2.0",
]

[project.optional-dependencies]
cu130 = [
    "torch==2.13.0",
]
test = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv-build==0.12.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "package/python"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "cuda: optional CUDA parity checks",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["latentdeck_operator_d2"]
