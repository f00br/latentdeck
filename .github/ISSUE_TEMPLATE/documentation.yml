name: Documentation problem
description: Report incorrect, missing, or unclear public documentation.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      description: Link the page and name the relevant heading.
    validations:
      required: true
  - type: textarea
    id: reader_goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
