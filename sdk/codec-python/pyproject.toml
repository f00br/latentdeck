[project]
name = "latentdeck-codec-sdk"
version = "0.2.0"
description = "Strict codec adapter contracts for LatentDeck Protocol 2."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "msgpack==1.2.2",
]

[build-system]
requires = ["uv-build==0.12.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
