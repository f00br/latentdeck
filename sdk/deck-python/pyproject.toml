[project]
name = "latentdeck-deck-sdk"
version = "0.2.0"
description = "Authoritative generic Deck operator contract for LatentDeck."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["uv-build==0.12.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
