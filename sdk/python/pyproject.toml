[project]
name = "latentdeck-cartridge"
version = "0.1.0"
description = "Python binding for the data-only LatentDeck Cartridge SDK."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = []

[project.scripts]
latentdeck-pack = "latentdeck_cartridge.__main__:pack_main"
latentdeck-convert = "latentdeck_cartridge.converter:convert_main"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../crates/cartridge-python/Cargo.toml"
python-source = "src"
module-name = "latentdeck_cartridge._native"
