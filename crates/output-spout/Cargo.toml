[package]
name = "latentdeck-output-spout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows Spout2 texture-output boundary"
build = "build.rs"

[features]
default = []
# Builds the original C ABI bridge and statically links the separately prepared,
# exact-pinned official SpoutDX12 sources. The default build never downloads.
spout-sdk = []

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_System_Com",
] }

[lints]
workspace = true
