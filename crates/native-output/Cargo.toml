[package]
name = "latentdeck-native-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reusable raw Tauri window and native DX12 presentation"

[features]
default = []
spout-sdk = ["latentdeck-output-spout/spout-sdk"]

[dependencies]
latentdeck-gpu = { path = "../gpu" }
latentdeck-output-spout = { path = "../output-spout" }
serde.workspace = true
tauri = { workspace = true, features = ["unstable"] }
thiserror.workspace = true
tokio.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
