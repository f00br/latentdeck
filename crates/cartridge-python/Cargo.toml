[package]
name = "latentdeck-cartridge-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 binding for the LatentDeck Cartridge SDK"

[lib]
# Keep the Cargo artifact unique inside the shared workspace target directory.
# Maturin installs it under the public `latentdeck_cartridge._native` name.
name = "latentdeck_cartridge_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
abi3-py312 = ["pyo3/abi3-py312"]

[dependencies]
latentdeck-cartridge = { path = "../cartridge" }
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true

[lints]
workspace = true
