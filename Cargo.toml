[workspace]
members = [
  "apps/latentdeck/src-tauri",
  "apps/latentplayer/src-tauri",
  "crates/cartridge",
  "crates/cartridge-python",
  "crates/control",
  "crates/core",
  "crates/gpu",
  "crates/gpu-python",
  "crates/library",
  "crates/native-output",
  "crates/output-spout",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.104"
atomicwrites = "=0.4.4"
bytes = "=1.12.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
clap = { version = "=4.6.6", features = ["derive"] }
crc32fast = "=1.5.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
memmap2 = "=0.9.11"
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
rmp-serde = "=1.3.1"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
safetensors = "=0.8.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
serde_path_to_error = "=0.1.20"
sha2 = "=0.11.0"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-dialog = "=2.7.2"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.26.0", features = ["serde", "v4", "v7"] }
wgpu = "=30.0.1"
windows = "=0.62.2"
windows-sys = "=0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
