[workspace]
members = [
  "apps/latentdeck/src-tauri",
  "apps/latentplayer/src-tauri",
  "crates/cartridge",
  "crates/control",
  "crates/core",
  "crates/gpu",
  "crates/output-spout",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
hex = "=0.4.3"
memmap2 = "=0.9.11"
rmp-serde = "=1.3.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
safetensors = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "macros", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.26.0", features = ["serde", "v4", "v7"] }
wgpu = "=30.0.1"
windows = "=0.62.2"
zip = { version = "=8.6.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
